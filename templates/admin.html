<!DOCTYPE html><html><head><title>Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container mt-4"><h3>Admin - Registrations</h3><a href="/" class="btn btn-primary btn-sm mb-3">Back to Home</a>
<table class="table table-bordered bg-white"><tr><th>#</th><th>Name</th><th>Email</th><th>Event</th></tr>
{% for r in regs %}<tr><td>{{ loop.index }}</td><td>{{ r.student_name }}</td><td>{{ r.email }}</td><td>{% for e in events %}{% if e.id == r.event_id %}{{ e.name }}{% endif %}{% endfor %}</td></tr>{% endfor %}
</table></div></body></html>
