<!DOCTYPE html><html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">🎉 EventVerse</a><a href="/" class="btn btn-light btn-sm">Home</a></div></nav>
<div class="container py-4"><h2>All Events</h2><div class="row mt-4">{% for e in events %}<div class="col-md-4 mb-4"><div class="card h-100"><img src="{{e['image']}}" style="height:180px;object-fit:cover"><div class="card-body"><h5>{{e['name']}}</h5><p>📅 {{e['date']}} {{e['time']}}<br>📍 {{e['location']}}</p><p>{{e['description']}}</p><a href="/event/{{e['id']}}" class="btn btn-outline-primary w-100">View Details</a></div></div></div>{% endfor %}</div></div></body></html>
