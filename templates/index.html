<!DOCTYPE html>
<html>
<head>
<title>EventManager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand">📅 EventManager</span><a href="/admin" class="btn btn-light btn-sm">Admin</a></div></nav>
<div class="container mt-4"><div class="row">
<div class="col-md-4"><div class="card p-3 shadow-sm"><h5>Create Event</h5>
<form action="/add_event" method="POST">
<input class="form-control mb-2" name="name" placeholder="Event Name" required>
<input class="form-control mb-2" type="date" name="date" required>
<input class="form-control mb-2" name="location" placeholder="Location" required>
<input class="form-control mb-2" type="number" name="capacity" placeholder="Capacity" required>
<textarea class="form-control mb-2" name="description" placeholder="Description"></textarea>
<button class="btn btn-primary w-100">Create Event</button>
</form></div>
<div class="card p-2 mt-3 text-center">Events: {{ total_events }} | Regs: {{ total_regs }}</div></div>
<div class="col-md-8"><form method="GET" class="d-flex mb-3"><input class="form-control me-2" name="search" placeholder="Search..."><button class="btn btn-outline-primary">Search</button></form>
{% for e in events %}
<div class="card p-3 mb-2 shadow-sm"><div class="d-flex justify-content-between"><div><h5>{{ e.name }}</h5><small>{{ e.date }} | {{ e.location }}</small></div><a href="/delete/{{ e.id }}" class="btn btn-danger btn-sm">X</a></div>
<form action="/register/{{ e.id }}" method="POST" class="d-flex gap-2 mt-2"><input class="form-control" name="student_name" placeholder="Your Name" required><input class="form-control" name="email" placeholder="Email" required><button class="btn btn-primary btn-sm">Register</button></form></div>
{% endfor %}
</div></div></div></body></html>
